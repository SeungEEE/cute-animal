name: Feature Issue
description: 새로운 기능을 개발할 때 사용하는 템플릿입니다.
title: "Feature: "
labels: ["✨ Feature"]
body:
  - type: input
    id: description
    attributes:
      label: "영상 제목"
      description: "영상 제목을 입력해주세요."
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "설명"
      description: "영상에 대한 설명을 적어주세요."
      value: |
        - **동물 종류**: 
        - **유튜브 링크**:
    validations:
      required: true

  - type: input
    id: links
    attributes:
      label: "🔗 참고 링크"
      description: "관련 문서, 디자인 링크 등이 있다면 첨부해주세요 (선택)"
      placeholder: "https://..."
    validations:
      required: false
